[project]
name = "rag-pipe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SAPNIL-M", email = "sapnilm670@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "google-genai>=2.12.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "sentence-transformers>=6.2.0",
    "spacy>=3.8.18",
    "sqlalchemy>=2.1.6",
    "torch>=2.6.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-pipe = "rag_pipe:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
